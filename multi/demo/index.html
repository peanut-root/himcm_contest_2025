<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefighter Patrol Optimization - Web Demo</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Firefighter Patrol Optimization Demo</h1>
            <div class="scenario-selector">
                <label for="scenario">Scenario:</label>
                <select id="scenario">
                    <option value="basic">Basic (2 agents, 6 rooms)</option>
                    <option value="redundancy">Redundancy (3 agents, 6 rooms)</option>
                    <option value="return">Return to Exit (2 agents, 4 rooms)</option>
                    <option value="multi">Multi-Agent (5 agents, 10 rooms)</option>
                </select>
                <span id="scenario-description"></span>
            </div>
        </header>

        <main class="demo-layout">
            <div class="canvas-container">
                <canvas id="canvas" width="800" height="600"></canvas>
                <div id="loading-indicator" class="loading" style="display: none;">
                    Loading...
                </div>
                <div id="hover-info" class="hover-info" style="display: none;">
                    <div id="hover-info-content"></div>
                </div>
            </div>

            <aside class="metrics-panel">
                <h2>Metrics</h2>
                <div class="metric">
                    <span class="metric-label">Makespan:</span>
                    <span id="metric-makespan" class="metric-value">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Coverage:</span>
                    <span id="metric-coverage" class="metric-value">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Path Length:</span>
                    <span id="metric-path-length" class="metric-value">--</span>
                </div>
                <div id="agent-times-container">
                    <h3>Agent Times</h3>
                    <div id="agent-times"></div>
                </div>
                <div id="agent-paths-container">
                    <h3>Agent Paths</h3>
                    <div id="agent-paths"></div>
                </div>
            </aside>
        </main>

        <footer class="controls">
            <div class="playback-controls">
                <button id="btn-play" class="btn">Play</button>
                <button id="btn-pause" class="btn" disabled>Pause</button>
                <button id="btn-restart" class="btn">Restart</button>
            </div>

            <div class="speed-control">
                <label for="speed-slider">Speed:</label>
                <input type="range" id="speed-slider" min="0.5" max="3" step="0.1" value="0.5">
                <span id="speed-display">0.5x</span>
            </div>

            <div class="timeline-control">
                <label for="timeline-slider">Timeline:</label>
                <input type="range" id="timeline-slider" min="0" max="100" step="1" value="0">
                <span id="time-display">0s / 0s</span>
            </div>
        </footer>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="scripts/building.js"></script>
    <script type="module" src="scripts/animation.js"></script>
    <script type="module" src="scripts/controls.js"></script>
    <script type="module" src="scripts/metrics.js"></script>
</body>
</html>
